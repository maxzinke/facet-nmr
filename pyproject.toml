[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facet-nmr"
version = "0.3.1"
description = "Retrieval-augmented prediction of backbone torsion angles, secondary structure, and Ramachandran basin populations from NMR chemical shifts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Maxim" },
]
keywords = ["NMR", "torsion angles", "protein", "backbone", "chemical shifts", "TALOS", "Ramachandran"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.16",
]
bmrb = [
    "httpx>=0.24",
]
plot = [
    "matplotlib>=3.6",
]
all = [
    "facet-nmr[onnx,bmrb,plot]",
]

[project.scripts]
facet = "facet.cli:main"

[project.urls]
Homepage = "https://github.com/bluegems661/facet-nmr"
Documentation = "https://github.com/bluegems661/facet-nmr#readme"

[tool.hatch.build.targets.wheel]
packages = ["facet"]

# Large artifacts are NOT shipped in the wheel. facet_retrieval_index.npz alone is
# 106 MB and PyPI rejects any file over 100 MB, so a bundled wheel (127.5 MB) cannot
# be uploaded at all. facet/assets.py downloads them into ~/.facet on first use and
# verifies each against a pinned SHA-256.
#
# Small fitted parameters under facet/data/ stay bundled -- they are kilobytes and
# needed for the retrieval-free path to work offline out of the box.
exclude = [
  "facet/weights/*.npz",
  "facet/weights/*.pt",
  "facet/weights/*.onnx",
  "facet/weights/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
