[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facet-nmr"
version = "0.4.0"
description = "Retrieval-augmented prediction of backbone torsion angles, secondary structure, and Ramachandran basin populations from NMR chemical shifts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-WEIGHTS"]
requires-python = ">=3.10"
authors = [
    { name = "Maximilian Zinke", email = "maximilian.zinke@gmail.com" },
]
keywords = ["NMR", "torsion angles", "protein", "backbone", "chemical shifts", "dihedral restraints", "Ramachandran", "secondary structure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.16",
]
bmrb = [
    "httpx>=0.24",
]
plot = [
    "matplotlib>=3.6",
]
all = [
    "facet-nmr[onnx,bmrb,plot]",
]
dev = [
    "facet-nmr[all]",
    "pytest>=7",
    "ruff>=0.4",
    "build",
    "twine",
]

[project.scripts]
facet = "facet.cli:main"

[project.urls]
Homepage = "https://github.com/maxzinke/facet-nmr"
Documentation = "https://github.com/maxzinke/facet-nmr/tree/main/docs"
Repository = "https://github.com/maxzinke/facet-nmr"
Issues = "https://github.com/maxzinke/facet-nmr/issues"
Changelog = "https://github.com/maxzinke/facet-nmr/blob/main/CHANGELOG.md"
"Web app" = "https://huggingface.co/spaces/SiXa18/facet"
"Model weights" = "https://huggingface.co/SiXa18/facet-weights"

[tool.hatch.build.targets.wheel]
packages = ["facet"]

# Large artifacts are NOT shipped in the wheel. facet_retrieval_index.npz alone is
# 133 MB and PyPI rejects any file over 100 MB, so a bundled wheel (~155 MB) cannot
# be uploaded at all. facet/assets.py downloads them into ~/.facet on first use and
# verifies each against a pinned SHA-256.
#
# Small fitted parameters under facet/data/ stay bundled -- they are kilobytes and
# needed for the retrieval-free path to work offline out of the box.
exclude = [
  "facet/weights/*.npz",
  "facet/weights/*.pt",
  "facet/weights/*.onnx",
  "facet/weights/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "needs_assets: requires the downloaded model weights / retrieval index",
]

[tool.ruff]
line-length = 100
target-version = "py310"
